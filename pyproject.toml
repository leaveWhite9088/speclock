[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speclock"
version = "0.1.0"
description = "SpecLock — single source of truth for business docs, read-only to coding agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp>=1.0",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
speclock-seed = "speclock.seed:main"
speclock-mcp = "speclock.mcp_server:main"
speclock-server = "speclock.main:run"

[tool.setuptools.packages.find]
include = ["speclock*"]

[tool.setuptools.package-data]
speclock = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
