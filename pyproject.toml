[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speclock"
dynamic = ["version"]
description = "SpecLock — single source of truth for business docs, read-only to coding agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
speclock = "speclock.cli:main"
speclock-mcp = "speclock.mcp_server:main"

[tool.setuptools.dynamic]
version = { attr = "speclock.__version__" }

[tool.setuptools.packages.find]
include = ["speclock*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
