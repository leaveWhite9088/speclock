# SpecLock monorepo 根：只负责把各个包拼成一个 uv 工作区（`uv sync` 一次装全，全部 editable）。
# 各包自己的 pyproject 在 packages/*；前端在 apps/web。依赖方向见 docs/DEVELOPMENT.md。
[project]
name = "speclock-workspace"
version = "0"
description = "SpecLock monorepo workspace root (not published)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["speclock"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
speclock = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
