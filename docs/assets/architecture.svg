<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 464" width="960" height="464" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">SpecLock 架构</title>
  <desc id="architecture-desc">人通过只读网页和命令行查看与批准；SpecLock Core 只做确定性的记录，数据在 .speclock 目录；四类 Agent 通过 REST 或 MCP 按角色接入。</desc>
  <defs>
    <marker id="arch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8c959f"/>
    </marker>
    <style>
      .arch-sans { font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; }
      .arch-mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; }
    </style>
  </defs>

  <rect width="960" height="464" fill="#ffffff"/>

  <!-- 连线 -->
  <g stroke="#8c959f" stroke-width="1.5" fill="none">
    <line x1="480" y1="88" x2="480" y2="134" marker-end="url(#arch-arrow)"/>
    <line x1="740" y1="184" x2="770" y2="184" marker-end="url(#arch-arrow)"/>
    <line x1="480" y1="280" x2="480" y2="232"/>
    <line x1="156" y1="324" x2="156" y2="370" marker-end="url(#arch-arrow)"/>
    <line x1="372" y1="324" x2="372" y2="370" marker-end="url(#arch-arrow)"/>
    <line x1="588" y1="324" x2="588" y2="370" marker-end="url(#arch-arrow)"/>
    <line x1="804" y1="324" x2="804" y2="370" marker-end="url(#arch-arrow)"/>
  </g>
  <rect x="490" y="100" width="88" height="20" fill="#ffffff"/>
  <text x="496" y="114" class="arch-sans" font-size="13" fill="#59636e">查看与批准</text>

  <g class="arch-sans">
    <!-- 人 -->
    <g transform="translate(320 24)">
      <rect width="320" height="64" rx="6" fill="#ffffff" stroke="#d0d7de"/>
      <text x="20" y="28" font-size="16" font-weight="600" fill="#1f2328">你</text>
      <text x="20" y="48" font-size="12.5" fill="#59636e">只读网页、命令行、对话里的一句“同意”</text>
    </g>

    <!-- Core（唯一的焦点） -->
    <g transform="translate(220 136)">
      <rect width="520" height="96" rx="6" fill="#eef6f4" stroke="#0f6b5c" stroke-width="1.5"/>
      <text x="24" y="38" font-size="18" font-weight="600" fill="#1f2328">SpecLock Core</text>
      <text x="24" y="62" font-size="13" fill="#3d4a47">规格与版本、审核单、执行记录、权限、审计</text>
      <text x="24" y="82" font-size="12.5" fill="#0f6b5c">确定性，不含任何 LLM</text>
    </g>

    <!-- 数据 -->
    <g transform="translate(772 148)">
      <rect width="168" height="72" rx="6" fill="#ffffff" stroke="#d0d7de"/>
      <text x="16" y="30" font-size="15" font-weight="600" fill="#1f2328" class="arch-mono">.speclock/</text>
      <text x="16" y="52" font-size="12.5" fill="#59636e">SQLite 与 key 文件</text>
    </g>

    <!-- 接口 -->
    <g transform="translate(58 280)">
      <rect width="844" height="44" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
      <text x="422" y="27" text-anchor="middle" font-size="13" fill="#59636e"><tspan class="arch-mono" fill="#1f2328">REST</tspan> 与 <tspan class="arch-mono" fill="#1f2328">MCP</tspan>，每次调用按 key 的角色放行</text>
    </g>

    <!-- Agents -->
    <g transform="translate(58 372)">
      <rect width="196" height="72" rx="6" fill="#ffffff" stroke="#d0d7de"/>
      <text x="16" y="30" font-size="15" font-weight="600" fill="#1f2328">需求 Agent</text>
      <text x="16" y="52" font-size="12.5" fill="#59636e">开审核单，写规格</text>
    </g>
    <g transform="translate(274 372)">
      <rect width="196" height="72" rx="6" fill="#ffffff" stroke="#d0d7de"/>
      <text x="16" y="30" font-size="15" font-weight="600" fill="#1f2328">执行 Agent</text>
      <text x="16" y="52" font-size="12.5" fill="#59636e">按锁定的版本实现</text>
    </g>
    <g transform="translate(490 372)">
      <rect width="196" height="72" rx="6" fill="#ffffff" stroke="#d0d7de"/>
      <text x="16" y="30" font-size="15" font-weight="600" fill="#1f2328">测试 Agent</text>
      <text x="16" y="52" font-size="12.5" fill="#59636e">独立验收</text>
    </g>
    <g transform="translate(706 372)">
      <rect width="196" height="72" rx="6" fill="#ffffff" stroke="#d0d7de"/>
      <text x="16" y="30" font-size="15" font-weight="600" fill="#1f2328">扫描 Agent</text>
      <text x="16" y="52" font-size="12.5" fill="#59636e">只读，找矛盾和含糊</text>
    </g>
  </g>
</svg>
