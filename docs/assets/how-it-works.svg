<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 232" width="960" height="232" role="img" aria-labelledby="how-it-works-title how-it-works-desc">
  <title id="how-it-works-title">SpecLock 的工作方式</title>
  <desc id="how-it-works-desc">人说出意图，需求 Agent 写成审核单，人批准后发布新版本，执行与测试 Agent 按锁定的版本实现和验收；规格有歧义时退回审核单。</desc>
  <defs>
    <marker id="hiw-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8c959f"/>
    </marker>
    <style>
      .hiw-sans { font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; }
      .hiw-mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; }
    </style>
  </defs>

  <rect width="960" height="232" fill="#ffffff"/>

  <!-- 连线（先画，压在节点下面） -->
  <g stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#hiw-arrow)">
    <line x1="172" y1="92" x2="210" y2="92"/>
    <line x1="364" y1="92" x2="402" y2="92"/>
    <line x1="556" y1="92" x2="594" y2="92"/>
    <line x1="748" y1="92" x2="786" y2="92"/>
  </g>
  <path d="M864 136 V192 a8 8 0 0 1 -8 8 H296 a8 8 0 0 1 -8 -8 V140" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#hiw-arrow)"/>
  <rect x="508" y="166" width="136" height="20" fill="#ffffff"/>
  <text x="576" y="180" text-anchor="middle" class="hiw-sans" font-size="13" fill="#59636e">有歧义就退回，不猜</text>

  <!-- 节点 -->
  <g class="hiw-sans">
    <g transform="translate(20 48)">
      <rect width="152" height="88" rx="6" fill="#ffffff" stroke="#d0d7de"/>
      <text x="16" y="28" font-size="12" fill="#59636e">人</text>
      <text x="16" y="54" font-size="16" font-weight="600" fill="#1f2328">说出要什么</text>
      <text x="16" y="74" font-size="12.5" fill="#59636e">一句话的业务意图</text>
    </g>
    <g transform="translate(212 48)">
      <rect width="152" height="88" rx="6" fill="#ffffff" stroke="#d0d7de"/>
      <text x="16" y="28" font-size="12" fill="#59636e">需求 Agent</text>
      <text x="16" y="54" font-size="16" font-weight="600" fill="#1f2328">审核单</text>
      <text x="16" y="74" font-size="12.5" fill="#59636e">为什么变、变成什么样</text>
    </g>
    <g transform="translate(404 48)">
      <rect width="152" height="88" rx="6" fill="#eef6f4" stroke="#0f6b5c" stroke-width="1.5"/>
      <text x="16" y="28" font-size="12" fill="#0f6b5c">人</text>
      <text x="16" y="54" font-size="16" font-weight="600" fill="#1f2328">批准</text>
      <text x="16" y="74" font-size="12.5" fill="#3d4a47">原话与内容哈希留痕</text>
    </g>
    <g transform="translate(596 48)">
      <rect width="152" height="88" rx="6" fill="#ffffff" stroke="#d0d7de"/>
      <text x="16" y="28" font-size="12" fill="#59636e">SpecLock</text>
      <text x="16" y="54" font-size="16" font-weight="600" fill="#1f2328">发布新版本</text>
      <text x="16" y="74" font-size="12.5" fill="#59636e" class="hiw-mono">v2.0.0</text>
    </g>
    <g transform="translate(788 48)">
      <rect width="152" height="88" rx="6" fill="#ffffff" stroke="#d0d7de"/>
      <text x="16" y="28" font-size="12" fill="#59636e">执行与测试 Agent</text>
      <text x="16" y="54" font-size="16" font-weight="600" fill="#1f2328">实现与验收</text>
      <text x="16" y="74" font-size="12.5" fill="#59636e">锁定版本，换人验收</text>
    </g>
  </g>
</svg>
