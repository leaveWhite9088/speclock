# SpecLock 环境配置：改上面的 active 一键切换环境；
# 也可用环境变量 SPECLOCK_ENV=server 覆盖（服务器 systemd 里推荐这种方式，文件不用动）。
active = "local"

# 内部整理的「语义复核」阈值（各环境共用）：条目的字变了、但提交者声明意思没变时，
# 只有同时满足下面全部条件才进入「待复核」（由另一个角色复核通过后才生效），
# 否则按业务变更处理（要人批准）。不写这一节就用代码里的保守默认值。
[review]
enabled = true         # false = 关闭这一档：条目的字只要变了就拒绝
max_entries = 3        # 一个 Commit 里最多有几条条目被改
max_edit_chars = 6     # 一条条目的名称 / 详述，各自最多改动多少个字（编辑距离）
max_edit_ratio = 0.15  # 并且改动不超过原文的这个比例
max_text_len = 2000    # 单段文字超过这个长度不做对比，直接按业务变更处理

# 本地开发：只监听本机回环，数据库在当前目录
[local]
db_url = "sqlite:///speclock.db"
host = "127.0.0.1"
port = 8000
public_url = ""  # 留空 = MCP 页面按访问地址自动生成 SPECLOCK_URL

# 官网服务器（ubuntu @ 81.70.39.239）：监听所有网卡，对外地址写死
# 注意：db_url 用相对路径时相对的是启动时的工作目录，服务器上建议改成绝对路径
[server]
db_url = "sqlite:///speclock.db"
host = "0.0.0.0"
port = 8000
public_url = "https://speclock.easyzai.top"
