{% extends "base.html" %}
{% block title %}SpecLock · 回执看板{% endblock %}
{% block content %}
<h1>「已完成」回执看板</h1>
<table>
  <tr><th>#</th><th>块</th><th>版本</th><th>Agent Key</th><th>任务</th><th>时间</th></tr>
  {% for a, block in rows %}
  <tr>
    <td>{{ a.id }}</td>
    <td>{{ block.title }}</td>
    <td>@{{ a.version }}</td>
    <td class="mono">{{ a.agent_key[:20] }}…</td>
    <td>{{ a.task_desc }}</td>
    <td>{{ a.created_at }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
