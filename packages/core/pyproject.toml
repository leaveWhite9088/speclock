[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speclock-core"
version = "0.2.7"
description = "SpecLock 核心：模型、版本 / diff、发布引擎、Commit、执行记录"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "speclock-config",
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
speclock-config = { workspace = true }
