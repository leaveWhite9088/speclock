[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speclock-mcp"
version = "0.2.7"
description = "SpecLock MCP server：Agent 经它读写规格（只依赖 REST，不碰数据库）"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "speclock-config",
    "httpx>=0.27",
    "mcp>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
speclock-config = { workspace = true }
